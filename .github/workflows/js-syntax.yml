name: JavaScript syntax

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.cjs' \) -not -path './.git/*' -print0)
      - name: Siege fidelity regression
        run: node tests/siege-fidelity.test.cjs
      - name: Combat fidelity regression
        run: node tests/combat-fidelity.test.js
